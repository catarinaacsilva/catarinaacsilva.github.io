server {
    listen 80;
    resolver 127.0.0.11 valid=5s;   # DNS interno do Docker: reparte pelas replicas

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        set $api http://api:8000;   # variavel => re-resolve o DNS (escala sem reiniciar)
        proxy_pass $api;
    }
}
